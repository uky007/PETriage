[package]
name = "petriage"
version = "0.3.0"
edition = "2024"
description = "Cross-platform PE file surface analysis tool for malware analysts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uky007/petriage"
homepage = "https://github.com/uky007/petriage"
documentation = "https://docs.rs/petriage"
exclude = ["CLAUDE.md", "feature_scope.md", "notes/"]
build = "build.rs"

[[bin]]
name = "petriage"
path = "src/main.rs"

[[bin]]
name = "petriage-gui"
path = "src/bin/petriage-gui.rs"
required-features = ["gui"]

[features]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:image"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
goblin = "0.9"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cms = "0.2"
x509-cert = "0.2"
der = { version = "0.7", features = ["derive"] }
const-oid = "0.9"
colored = "3"
regex = "1"
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
egui_extras = { version = "0.31", optional = true, features = ["syntect"] }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["ico", "png", "bmp"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
