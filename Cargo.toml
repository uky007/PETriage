[package]
name = "petriage"
version = "0.1.0"
edition = "2024"
description = "Cross-platform PE file surface analysis tool for malware analysts"
license = "Apache-2.0"

[features]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:image"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
goblin = "0.9"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cms = "0.2"
x509-cert = "0.2"
der = { version = "0.7", features = ["derive"] }
const-oid = "0.9"
colored = "3"
eframe = { version = "0.31", optional = true }
egui = { version = "0.31", optional = true }
egui_extras = { version = "0.31", optional = true, features = ["syntect"] }
rfd = { version = "0.15", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["ico", "png", "bmp"] }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
